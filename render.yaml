services:
  - type: web
    name: trader-agent
    runtime: node
    rootDir: packages/agent
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BOT_PRIVATE_KEY
        sync: false
      - key: BOT_ADDRESS
        sync: false
      - key: SWAP_REGISTRY_ADDRESS
        sync: false
      - key: ERC8004_AGENT_ID
        sync: false
      - key: BUILDER_CODE
        sync: false
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: PORT
        value: "3000"
      - key: PRICE_PER_ANALYSIS
        value: "0.01"
      - key: SWAP_FEE_USDC
        value: "0.02"
      - key: MIN_SWAP_USDC
        value: "5"
      - key: BOT_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
